<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoZio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: un telefono centrato; interruttore Giocatore/Maestro in alto, schermata al centro, barra in basso. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --ink:#14201A; --muted:#55645B; --line:#E1E6DB;
  --accent:#135C36; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#14201A; --inv-fg:#FFFFFF; --inv-muted:#AEBBB3; --inv-panel:#1F3027; --inv-line:#3C5446;
  --ok-bg:#DDF3E4; --ok-fg:#135C36; --warn-bg:#FFF4E0; --warn-fg:#5A4A2A; --warn-line:#E7D5B0;
  --soft:#E9EDE4; --danger:#8E1B1B; --danger-line:#E2B8B8; --amber:#8A5A00; --track:#DDE3D7; --bar:#1F7A4D;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#18241D; --ink:#EEF3EF; --muted:#9FB0A5; --line:#263A2E;
  --accent:#6FD39A; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#223A2D; --inv-fg:#FFFFFF; --inv-muted:#B6C6BC; --inv-panel:#2B4838; --inv-line:#4A6857;
  --ok-bg:#1D3D2B; --ok-fg:#8FE3B1; --warn-bg:#3A301B; --warn-fg:#EAD9AE; --warn-line:#5A4A2A;
  --soft:#1E2D24; --danger:#F0A3A3; --danger-line:#5A2E2E; --amber:#E8B85A; --track:#2A3C31; --bar:#4FBF86;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#18241D; --ink:#EEF3EF; --muted:#9FB0A5; --line:#263A2E;
  --accent:#6FD39A; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#223A2D; --inv-fg:#FFFFFF; --inv-muted:#B6C6BC; --inv-panel:#2B4838; --inv-line:#4A6857;
  --ok-bg:#1D3D2B; --ok-fg:#8FE3B1; --warn-bg:#3A301B; --warn-fg:#EAD9AE; --warn-line:#5A4A2A;
  --soft:#1E2D24; --danger:#F0A3A3; --danger-line:#5A2E2E; --amber:#E8B85A; --track:#2A3C31; --bar:#4FBF86;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body{display:flex;flex-direction:column;align-items:center}
#tel{width:100%;max-width:360px;flex:1 1 0;min-height:0;max-height:780px;position:relative;overflow:hidden;background:var(--bg)}
#tg,#app{position:absolute;inset:0;display:flex;flex-direction:column}
#app{background:var(--bg);z-index:5;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.tghead{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-weight:700;display:flex;align-items:center;justify-content:center}
.tghead b{display:block;font-size:16px}.tghead span{font-size:13px;color:var(--muted)}
#chat{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--soft)}
.dia{align-self:center;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);border-radius:99px;padding:2px 10px;margin-bottom:6px}
.msg{max-width:88%;background:var(--surface);border-radius:14px 14px 14px 4px;padding:8px 12px 6px;font-size:15px;line-height:1.35;align-self:flex-start;margin-top:6px}
.msg small{display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:2px}
.kb{align-self:flex-start;width:88%;display:flex;flex-direction:column;gap:4px}
.kb button{border:0;border-radius:10px;height:38px;background:color-mix(in srgb,var(--ink) 55%,transparent);color:var(--bg);font-size:14px;font-weight:500}
.inbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
.menub{background:#3390EC;color:#fff;border:0;border-radius:18px;height:36px;padding:0 16px;font-weight:700;font-size:14px}
.fake{flex:1 1 0;height:36px;border-radius:18px;background:var(--bg);color:var(--muted);display:flex;align-items:center;padding:0 14px;font-size:15px}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.ahead button{border:0;background:none;font-size:15px;color:#3390EC;padding:8px;min-width:44px}
.banner{position:absolute;left:10px;right:10px;top:58px;z-index:20;background:var(--lime);color:var(--lime-ink);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:down .25s ease-out}
.banner span{flex:1 1 0;min-width:0}
.banner button{border:0;border-radius:10px;height:36px;padding:0 14px;background:#14201A;color:#FFFFFF;font-weight:700;font-size:14px}
.banner button.x{background:none;color:#14201A;padding:0 6px;font-size:20px}
@keyframes down{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.atit{text-align:center;line-height:1.15}.atit b{display:block;font-size:15px}.atit span{font-size:12px;color:var(--muted)}
.sw{width:100%;max-width:360px;display:flex;gap:6px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:var(--inv-bg)}
.sw button{flex:1 1 0;height:36px;border-radius:10px;border:0;font-size:14px;font-weight:500;background:var(--inv-panel);color:var(--inv-muted)}
.sw button.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
#sch{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.top{padding:16px 16px 4px}
.top small{display:block;font-size:14px;color:var(--muted)}
h1{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.5px;text-wrap:balance}
.lab{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.card h2{margin:0;font-size:20px;font-weight:700}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--ok-bg);color:var(--ok-fg);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.dim{color:var(--muted);font-size:14px}
.btn{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;padding:0 16px}
.btn.dark{background:var(--inv-bg);color:var(--inv-fg);border:0;font-weight:700}
.btn.lime{background:var(--lime);color:var(--lime-ink);border:0;font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.inv{background:var(--inv-bg);color:var(--inv-fg);border:0}
.inv .dim{color:var(--inv-muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent;font-weight:700}
.inv .chip{background:transparent;border-color:var(--inv-line);color:var(--inv-fg)}
.inv .chip.on{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.full{background:var(--inv-bg);color:var(--inv-fg);flex:1 1 auto;display:flex;flex-direction:column}
.full .back{align-self:flex-start;margin:20px 20px 0;padding:0;border:0;background:none;font-size:14px;font-weight:700;color:var(--lime)}
.full h1{font-size:36px;line-height:1.05;letter-spacing:-1px}
.panel{margin:28px 20px 0;background:var(--inv-panel);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel .row span:first-child{color:var(--inv-muted)}
.big{height:58px;border-radius:16px;border:0;background:var(--lime);color:var(--lime-ink);font-size:18px;font-weight:700;width:100%}
.ghost{flex:1 1 0;height:52px;border-radius:16px;border:1.5px solid var(--inv-line);background:transparent;color:var(--inv-fg);font-size:16px;font-weight:500}
.tabs{display:flex;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabs button{white-space:nowrap;border:0;background:none;font-size:14px;color:var(--muted);padding:8px 10px;border-radius:10px}
.tabs button.on{color:var(--accent);font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:0}
.warn b{color:var(--ink)}
.warn .btn{flex:1 1 0;height:42px;font-size:14px;font-weight:700;padding:0;border-color:var(--warn-line);background:var(--surface)}
.warn .btn.dark{background:var(--inv-bg)}
.note{background:var(--soft);border-radius:20px;padding:16px 18px;font-size:15px}
.ok{background:var(--ok-bg);border-radius:20px;padding:16px 18px;color:var(--ok-fg)}
.partita{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.barre{display:flex;gap:6px}
.barre i{flex:1 1 0;height:8px;border-radius:4px;background:var(--track)}
.barre i.p{background:var(--bar)}
.posti{display:flex;gap:8px}
.posto{flex:1 1 0;border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;font-weight:700;background:var(--ok-bg);color:var(--ok-fg)}
.posto.v{background:none;border:1.5px dashed var(--muted);color:var(--muted);font-weight:400;padding:9px 6px}
.ond{display:flex;align-items:center;gap:10px}
.ond i{width:10px;height:10px;border-radius:50%;background:var(--bar);flex:none}
.ond i.f{background:none;border:2px solid var(--muted)}
.ond span{flex:1 1 auto;min-width:0}
.ond em{font-style:normal;color:var(--muted);font-size:14px}
.stato-s{color:var(--ok-fg);font-weight:700}.stato-t{color:var(--amber)}.stato-n{color:var(--muted)}.stato-x{color:var(--danger)}
.foot{display:flex;gap:10px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
#toast{position:absolute;left:20px;right:20px;bottom:84px;background:var(--inv-bg);color:var(--inv-fg);border-radius:14px;padding:12px 16px;font-size:14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gioc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.gioc b{display:block;font-size:16px}.gioc span{font-size:13px;color:var(--muted)}.gioc em{font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
/* Su schermo largo il prototipo si mostra dentro un iPhone mini: area utile 360 x 780 px. */
@media (min-width:500px){
  body:not(.tgm){background:var(--soft);overflow-y:auto;padding-bottom:28px}
  body:not(.tgm) #tel{flex:none;width:360px;height:780px;max-width:360px;max-height:none;margin-top:16px;border-radius:44px;transform:scale(var(--k,1));transform-origin:top center;margin-bottom:calc(780px * (var(--k,1) - 1));box-shadow:0 0 0 12px #0B0F0D,0 0 0 14px #2A322D,0 18px 50px rgba(0,0,0,.35)}
  body:not(.tgm) #tg,body:not(.tgm) #app{top:44px}
  body:not(.tgm) #tel::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:#0B0F0D;z-index:50}
  body:not(.tgm) #tel::after{content:"9:41";position:absolute;top:0;left:0;right:0;height:44px;padding:14px 30px 0;font-size:15px;font-weight:700;color:var(--ink);background:var(--surface);z-index:40;pointer-events:none}
  body:not(.tgm) .tabs{padding-bottom:24px}
  body:not(.tgm) .foot{padding-bottom:24px}
}
.tgm .sw,.tgm .ahead,.tgm #tg{display:none}
.tgm #tel{max-width:none;max-height:none;border-radius:0;box-shadow:none}
.tgm .banner{top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="sw" role="group" aria-label="Chi sta guardando">
  <button id="bg" data-a="ruolo" data-v="g">Giocatore</button>
  <button id="bm" data-a="ruolo" data-v="m">Maestro</button>
</div>
<div id="tel">
  <div id="tg"></div>
  <div id="app" hidden>
    <div class="ahead"><button data-a="close">× Chiudi</button><div class="atit"><b>lozio bot</b><span>mini app</span></div><button data-a="dots" aria-label="Altro">⋯</button></div>
    <div id="sch"></div>
    <div class="tabs" id="tabs"></div>
    <div id="toast" hidden role="status"></div>
    <div id="banner" class="banner" hidden role="status"></div>
  </div>
</div>

<script>
var S = {
  open: false, ruolo: 'g', gs: 'home', invito: 'aperto', nonRiesco: false,
  orari: { fm: false, fp: false, fs: true, wm: true, wp: true }, due: false,
  ms: 'home', gia: {}, edit: false, pick: false, marOff: false, liv: 'principiante', tipo: 'mista', prop: 'aperta', avv: 'aperto',
  sabOff: false, lunOff: false, sel: 'sab'
};
var NL = { principiante: 'Principianti', base: 'Base', intermedio: 'Intermedi' };
var NT = { maschile: 'Maschile', femminile: 'Femminile', mista: 'Mista' };
var ESITO = { annullata: 'partita annullata, giocatori avvisati.', aspetta: 'aspetto ancora, ti riscrivo domani alle 9.', altri: 'invitati altri 3 giocatori.' };
var tt;
function flash(m){ var t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(function(){t.hidden=true},2400); }
function chips(list, cur, act){ return '<div class="chips">'+list.map(function(k){ return '<button class="chip'+(cur[k[0]]?' on':'')+'" data-a="'+act+'" data-v="'+k[0]+'">'+k[1]+'</button>'; }).join('')+'</div>'; }

function gHome(){
  var h = '<div class="top"><h1>Le mie Partite Tattiche</h1></div><div class="pad"><div class="lab">Prossima</div>';
  if(!S.nonRiesco){
    h += '<div class="card"><div class="row"><h2>Martedì 3 novembre</h2><span class="pill">Confermata</span></div><div>18:00–19:30 · Padel Village</div><div class="dim">Con: Marco R., Giulia B.</div><button class="btn" data-a="nonRiesco" style="margin-top:6px">Non riesco più</button></div>';
  } else {
    h += '<div class="note"><b>Martedì 3 novembre: posto liberato</b><div class="dim" style="margin-top:4px">Grazie dell\'avviso. LoZio è stato avvisato e cerca un sostituto.</div></div>';
  }
  if(S.invito==='si'){
    h += '<div class="card"><div class="row"><h2 style="font-size:20px">Sabato 7 novembre</h2><span class="pill">Confermata</span></div><div>09:30–11:00 · Padel Village</div><div class="dim">Ti scrivo appena la Partita Tattica è completa.</div></div>';
  }
  if(S.invito==='aperto'||S.invito==='dopo'){
    h += '<div class="lab" style="margin-top:8px">Inviti</div><div class="card inv"><div style="font-size:13px;font-weight:700;color:var(--lime)">LoZio ti ha invitato</div><h2 style="font-size:20px">Sabato 7 novembre</h2><div class="dim">09:30–11:00 · Padel Village</div><div class="row" style="margin-top:6px"><span class="dim">20 euro a persona</span><button class="btn lime" style="height:40px;font-size:14px;border-radius:12px" data-a="gs" data-v="invito">Rispondi</button></div></div>';
  }
  return h+'</div>';
}
function gInvito(){
  return '<div class="full"><button class="back" data-a="gs" data-v="home">‹ Le mie Partite Tattiche</button>'+
  '<div style="padding:32px 20px 0;display:flex;flex-direction:column;gap:10px"><div style="font-size:14px;font-weight:700;color:var(--lime)">Ciao Lidia, LoZio ha aperto una Partita Tattica</div><h1>Sabato<br>7 novembre</h1><div style="font-size:18px;color:var(--inv-muted)">09:30–11:00 · Padel Village</div></div>'+
  '<div class="panel"><div class="row"><span>Costo</span><b>20 euro a persona</b></div><div class="row"><span>Si gioca in</span><b>4, con LoZio</b></div></div>'+
  '<div style="flex:1 1 auto"></div><div style="padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px"><button class="big" data-a="ciSono">Ci sono</button><div style="display:flex;gap:10px"><button class="ghost" data-a="nonPosso">Non posso</button><button class="ghost" data-a="piuTardi">Più tardi</button></div><div style="text-align:center;font-size:13px;color:var(--inv-muted)">I posti sono pochi: rispondi appena puoi.</div></div></div>';
}
function gOrari(){
  return '<div class="top"><h1>Le mie disponibilità</h1></div><div class="pad"><div style="line-height:1.45;color:var(--muted)">Qui scegli quando sei libero. LoZio ti propone una Partita Tattica solo in questi momenti.</div><div class="lab">Da lunedì a venerdì</div>'+chips([['fm','Mattina'],['fp','Pranzo'],['fs','Sera']],S.orari,'orario')+
  '<div class="lab" style="margin-top:6px">Sabato e domenica</div>'+chips([['wm','Mattina'],['wp','Pomeriggio']],S.orari,'orario')+
  '<div class="lab" style="margin-top:6px">Partite a settimana</div>'+chips([['1','Una basta'],['2','Anche una seconda']],{1:!S.due,2:S.due},'freq')+
  '<div class="dim">Ti contatto per una partita a settimana. La seconda solo se la vuoi tu.</div><button class="btn dark" style="height:52px;font-size:16px" data-a="salva">Salva le disponibilità</button></div>';
}
function gAmico(){
  return '<div class="top"><h1>Porta un amico</h1></div><div class="pad"><div>Vuoi portare un amico a giocare con LoZio? Scegli come mandargli l\'invito.</div><button class="btn dark" style="height:52px;font-size:16px" data-a="amico">Invia su WhatsApp</button><button class="btn" style="height:52px;font-size:16px" data-a="amico">Invia su Telegram</button></div>';
}
function gInfo(){
  return '<div class="top"><h1>Come funziona</h1></div><div class="pad" style="line-height:1.45;color:var(--muted)"><div>LoZio organizza Partite Tattiche a Padel Village: si gioca in 4, lui in campo con tre di voi.</div><div>LoZio gioca un terzo del tempo con ognuno di voi: lo hai al tuo fianco per i suggerimenti tattici e di fronte, per metterli in pratica contro di lui.</div><div>Ti scrivo io quando c\'è una partita per te: rispondi con un tocco.</div><div style="font-weight:700;color:var(--ink)">Costo: 20 euro a persona.</div></div>';
}

var P = { mar:{liv:'principiante',tipo:'mista'}, sab:{liv:'base',tipo:'mista'}, lun:{liv:'principiante',tipo:'mista'} };
var DATE = { mar:'Martedì 3 novembre', sab:'Sabato 7 novembre', lun:'Lunedì 9 novembre' };
var ORA = { mar:'18:00–19:30', sab:'09:30–11:00', lun:'18:00–19:30' };
function visibile(k){ return k==='mar' ? !S.marOff && S.avv!=='annullata' : k==='sab' ? !S.sabOff : (S.prop==='si' && !S.lunOff); }
function mHome(){
  var h = '<div class="top"><small>Lunedì 2 novembre</small><h1>Home</h1></div><div class="pad"><div class="lab">Da decidere con LoZio</div>', vuoto = true;
  if(S.prop==='aperta'){
    vuoto = false;
    h += '<div class="card inv"><div style="font-size:13px;font-weight:700;color:var(--lime)">Aprire una Partita Tattica?</div><h2 style="font-size:21px">Lunedì 9 novembre, 18:00–19:30</h2>'+
      chips([['principiante','Principianti'],['base','Base'],['intermedio','Intermedi']],{principiante:S.liv==='principiante',base:S.liv==='base',intermedio:S.liv==='intermedio'},'liv')+
      chips([['maschile','Maschile'],['femminile','Femminile'],['mista','Mista']],{maschile:S.tipo==='maschile',femminile:S.tipo==='femminile',mista:S.tipo==='mista'},'tipo')+
      '<div style="display:flex;gap:10px;margin-top:4px"><button class="btn lime" style="flex:1 1 0;height:50px;font-size:16px" data-a="apri">Apri e invita 5</button><button class="btn" style="width:90px;height:50px;background:transparent;border-color:var(--inv-line);color:var(--inv-fg)" data-a="no">No</button></div></div>';
  } else if(S.prop==='si' && !S.lunOff){
    h += '<div class="ok"><b>Partita aperta: lunedì 9, '+NL[P.lun.liv]+', '+NT[P.lun.tipo].toLowerCase()+'</b><div style="margin-top:4px;font-size:14px">Ho invitato 5 giocatori. Alle 12:30 altri 3, se servono.</div></div>';
  } else if(S.prop==='no'){
    h += '<div class="note">Lunedì 9 novembre: nessuna Partita Tattica.</div>';
  }
  if(S.avv==='aperto'){
    vuoto = false;
    h += '<div class="warn"><b style="font-size:16px">Martedì 3: non si è chiusa</b><div style="font-size:14px">1 posto su 3 coperto, 11 giocatori contattati.</div><div style="display:flex;gap:8px;margin-top:4px"><button class="btn" data-a="avv" data-v="annullata">Annulla</button><button class="btn" data-a="avv" data-v="aspetta">Aspetta</button><button class="btn dark" data-a="avv" data-v="altri">Altri 3</button></div></div>';
  } else {
    h += '<div class="note">Martedì 3: '+ESITO[S.avv]+'</div>';
  }
  if(vuoto) h += '<div class="dim">Per ora non c\'è altro da decidere. Ti avviso io quando serve.</div>';
  var n = ['mar','sab','lun'].filter(visibile).length;
  h += '<button class="partita" data-a="ms" data-v="tattiche" style="margin-top:6px"><div class="row" style="width:100%"><b style="font-size:16px">Partite Tattiche aperte</b><span class="pill">'+n+'</span></div><div class="dim">Guarda a che punto sono e gestiscile.</div></button>';
  return h+'</div>';
}
function riga(k){
  var d = { mar:['Martedì 3, 18:00','1 su 3 · 11 contattati, non si è chiusa',[1,0,0]], sab:['Sabato 7, 09:30','2 su 3 · 5 invitati, 2 non hanno risposto',[1,1,0]], lun:['Lunedì 9, 18:00','0 su 3 · 5 invitati, nessuna risposta',[0,0,0]] }[k];
  var x = d[2];
  var n = k==='mar' ? 0 : 0;
  return '<button class="partita" data-a="det" data-v="'+k+'"><div class="row" style="width:100%"><b style="font-size:17px">'+d[0]+'</b><span class="dim">'+NL[P[k].liv]+' · '+NT[P[k].tipo].toLowerCase()+'</span></div><div class="barre" style="width:100%">'+
    (k==='sab'?'<i class="p"></i><i class="p"></i><i></i>':k==='mar'?'<i class="p"></i><i></i><i></i>':'<i></i><i></i><i></i>')+'</div><div class="dim" style="color:var(--ink)">'+d[1]+'</div></button>';
}
function mTatt(){
  var l = ['mar','sab','lun'].filter(visibile);
  var h = '<div class="top"><small>'+(l.length===1?'1 aperta':l.length+' aperte')+'</small><h1>Partite Tattiche</h1></div><div class="pad">';
  h += l.length ? l.map(riga).join('') : '<div class="dim">Nessuna Partita Tattica aperta. Le proposte nuove le trovi in Home.</div>';
  return h+'</div>';
}
function mDett(){
  var k = S.sel;
  var posti = k==='sab' ? ['Giulia Bianchi','Marco Rossi',''] : k==='mar' ? ['Lidia Ferri','',''] : ['','',''];
  var ond = k==='sab' ? [['1ª ondata · 5 invitati','ieri 08:05',1],['2ª ondata · 3 invitati','ieri 12:30',1],['3ª ondata · 3 invitati','ieri 20:30',0]]
    : k==='mar' ? [['1ª ondata · 5 invitati','sab 08:05',1],['2ª ondata · 3 invitati','sab 12:30',1],['3ª ondata · 3 invitati','sab 20:30',1]]
    : [['1ª ondata · 5 invitati','adesso',1],['2ª ondata · 3 invitati','oggi 12:30',0],['3ª ondata · 3 invitati','oggi 20:30',0]];
  var inv = k==='sab' ? [['Giulia Bianchi','Ci sono','s'],['Marco Rossi','Ci sono','s'],['Sara Conte','Più tardi','t'],['Luca Moretti','Non ha risposto','n'],['Paola Greco','Non può','x']]
    : k==='mar' ? [['Lidia Ferri','Ci sono','s'],['Paola Greco','Più tardi','t'],['Sara Conte','Non può','x'],['Luca Moretti','Non ha risposto','n'],['Anna Villa','Non ha risposto','n']]
    : ['Anna Villa','Paolo Neri','Elena Costa','Davide Fabbri','Chiara Serra'].map(function(n){return [n,'Non ha risposto','n']});
  (S.gia[k]||[]).forEach(function(n){ inv.push([n,'Invitato adesso','n']); });
  var h = '<button class="back" data-a="ms" data-v="tattiche" style="align-self:flex-start;margin:20px 20px 0;padding:0;border:0;background:none;font-size:14px;font-weight:700;color:var(--accent)">‹ Partite Tattiche</button>'+
    '<div class="top" style="padding-top:12px"><h1 style="font-size:28px">'+DATE[k]+'</h1><small style="margin-top:2px">'+ORA[k]+' · '+NL[P[k].liv]+' · '+NT[P[k].tipo].toLowerCase()+'</small></div><div class="pad">'+
    '<div class="card"><div class="lab">Posti</div><div class="posti">'+posti.map(function(p){return '<div class="posto'+(p?'':' v')+'">'+(p||'libero')+'</div>'}).join('')+'</div></div>'+
    '<div class="card"><div class="lab">Ondate</div>'+ond.map(function(o){return '<div class="ond"><i class="'+(o[2]?'':'f')+'"></i><span style="'+(o[2]?'':'color:var(--muted)')+'">'+o[0]+'</span><em>'+o[1]+'</em></div>'}).join('')+'</div>'+
    '<div class="card"><div class="lab">Invitati</div>'+inv.map(function(i){return '<div class="row"><span>'+i[0]+'</span><span class="stato-'+i[2]+'">'+i[1]+'</span></div>'}).join('')+'</div>';
  if(S.edit){
    h += '<div class="card"><div class="lab">Modifica</div>'+
      chips([['principiante','Principianti'],['base','Base'],['intermedio','Intermedi']],{principiante:P[k].liv==='principiante',base:P[k].liv==='base',intermedio:P[k].liv==='intermedio'},'eliv')+
      chips([['maschile','Maschile'],['femminile','Femminile'],['mista','Mista']],{maschile:P[k].tipo==='maschile',femminile:P[k].tipo==='femminile',mista:P[k].tipo==='mista'},'etipo')+
      '<div class="dim">Chi ha già risposto Ci sono resta dentro: ti chiedo prima di toccarlo.</div></div>';
  }
  if(S.pick){
    var gi = S.gia[k]||[];
    var cand = ['Anna Villa','Paolo Neri','Elena Costa','Davide Fabbri','Chiara Serra','Marta Gallo','Nico Bassi'].filter(function(n){ return gi.indexOf(n)<0 && !(k==='lun'||k==='mar'&&n==='Anna Villa'); });
    if(k==='lun') cand = ['Marta Gallo','Nico Bassi','Elisa Monti','Gabriele Riva'].filter(function(n){return gi.indexOf(n)<0});
    h += '<div class="card"><div class="lab">Chi invito?</div><button class="btn dark" data-a="altri" style="height:46px">Altri 3 scelti da LoZio</button>'+
      cand.slice(0,4).map(function(n){return '<button class="btn" data-a="inv1" data-v="'+n+'" style="height:44px;font-weight:500">Invita '+n+'</button>'}).join('')+'</div>';
  }
  return h+'</div>';
}
function mGioc(){
  var l=[['Giulia Bianchi','donna · omogenea e mista','Base'],['Marco Rossi','uomo · mista','Base'],['Sara Conte','donna · mista','Principiante'],['Luca Moretti','uomo · omogenea e mista','Intermedio'],['Paola Greco','donna · omogenea','Base'],['Lidia Ferri','donna · omogenea e mista','Principiante']];
  return '<div class="top"><h1>Giocatori</h1></div><div class="pad" style="gap:8px">'+l.map(function(g){return '<div class="gioc"><div><b>'+g[0]+'</b><span>'+g[1]+'</span></div><em>'+g[2]+'</em></div>'}).join('')+'</div>';
}

function msg(t, time, btn){ var v = btn.match(/data-v="([^"]+)"/)[1]; return '<div class="msg" role="button" tabindex="0" data-a="open" data-v="'+v+'" style="cursor:pointer">'+t+'<small>'+time+'</small></div><div class="kb">'+btn+'</div>'; }
function kbBtn(label, v){ return '<button data-a="open" data-v="'+v+'">'+label+'</button>'; }
function renderChat(){
  var g = S.ruolo==='g';
  var h = '<div class="tghead"><div class="av">L</div><div><b>lozio bot</b><span>bot</span></div></div><div id="chat"><div class="dia">Oggi</div>';
  if(g){
    h += msg('Ciao Lidia, LoZio ha aperto una Partita Tattica.<br>Sabato 7 novembre, 09:30-11:00, Padel Village.<br>20 euro a persona.<br>Ci sei?', '20:40', kbBtn('Rispondi','invito'));
    h += msg('Promemoria: martedì 3 novembre alle 18:00 hai la Partita Tattica con LoZio a Padel Village.', '20:45', kbBtn('Vedi Partita Tattica','home'));
  } else {
    h += msg('Lunedì 9 novembre, 18:00-19:30: vuoi aprire una tattica?', '08:00', kbBtn('Decidi','home'));
    h += msg('La tattica di martedì 3 novembre non si è chiusa: 1 posto su 3 coperto, 11 giocatori contattati. Che facciamo?', '09:00', kbBtn('Decidi','home'));
  }
  h += '</div><div class="inbar"><button class="menub" data-a="open" data-v="'+(g?'home':'home')+'">'+(g?'Apri app':'Gestione')+'</button><div class="fake">Messaggio</div></div>';
  document.getElementById('tg').innerHTML = h;
}
function render(){
  document.getElementById('bg').className = S.ruolo==='g'?'on':'';
  document.getElementById('bm').className = S.ruolo==='m'?'on':'';
  renderChat();
  var ap = document.getElementById('app'); ap.hidden = !S.open;
  if(S.open) renderApp();
}
function renderApp(){
  var sch = document.getElementById('sch'), tabs = document.getElementById('tabs'), h='', t='';
  if(S.ruolo==='g'){
    h = S.gs==='home'?gHome():S.gs==='invito'?gInvito():S.gs==='orari'?gOrari():S.gs==='amico'?gAmico():gInfo();
    if(S.gs!=='invito'){
      t = [['home','Tattiche'],['orari','Disponibilità'],['amico','Invita'],['info','Info']].map(function(x){return '<button class="'+(S.gs===x[0]?'on':'')+'" data-a="gs" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
    }
  } else {
    h = S.ms==='home'?mHome():S.ms==='tattiche'?mTatt():S.ms==='partita'?mDett():mGioc();
    if(S.ms==='partita'){
      h += '<div style="flex:1 1 auto"></div><div class="foot">'+
        (S.edit ? '<button class="btn dark" style="flex:1 1 0;height:52px;font-size:16px" data-a="salvaMod">Salva modifiche</button><button class="btn" style="width:110px;height:52px;font-size:16px" data-a="chiudiMod">Indietro</button>'
        : S.pick ? '<button class="btn" style="flex:1 1 0;height:52px;font-size:16px" data-a="chiudiMod">Indietro</button>'
        : '<button class="btn dark" style="flex:1 1 0;height:52px;font-size:15px;padding:0 6px" data-a="pick">Invita altri</button><button class="btn" style="flex:1 1 0;height:52px;font-size:15px;padding:0 6px" data-a="mod">Modifica</button><button class="btn danger" style="flex:1 1 0;height:52px;font-size:15px;padding:0 6px" data-a="annulla">Annulla</button>')+'</div>';
    }
    var sez = S.ms==='partita' ? 'tattiche' : S.ms;
    t = [['home','Home'],['tattiche','Tattiche'],['giocatori','Giocatori']].map(function(x){return '<button class="'+(sez===x[0]?'on':'')+'" data-a="ms" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
  }
  sch.innerHTML = h; tabs.innerHTML = t; tabs.hidden = !t;
  if(S.gs==='invito' && S.ruolo==='g'){ sch.style.background='var(--inv-bg)'; } else { sch.style.background=''; }
}

var bt, bh;
function hideBanner(){ clearTimeout(bt); clearTimeout(bh); document.getElementById('banner').hidden = true; }
function mostraBanner(){
  if(!S.open) return;
  var g = S.ruolo==='g';
  if(g && S.invito!=='aperto' && S.invito!=='dopo') return;
  var b = document.getElementById('banner');
  b.innerHTML = g
    ? '<span><b>Nuovo invito</b><br>Sabato 7 novembre, 09:30</span><button data-a="bnr" data-v="invito">Rispondi</button><button class="x" data-a="bx" aria-label="Chiudi avviso">×</button>'
    : '<span><b>Sara Conte ha detto Ci sono</b><br>Sabato 7: ora 3 su 3</span><button data-a="bnr" data-v="det">Vedi</button><button class="x" data-a="bx" aria-label="Chiudi avviso">×</button>';
  b.hidden = false;
  clearTimeout(bh); bh = setTimeout(hideBanner, 9000);
}
function act(a, v){
  if(a==='ruolo'){ S.ruolo=v; S.open=false; hideBanner(); }
  else if(a==='bnr'){ hideBanner(); if(v==='invito'){ S.gs='invito'; } else { S.sel='sab'; S.ms='partita'; } }
  else if(a==='bx'){ hideBanner(); }
  else if(a==='open'){ S.open=true; if(S.ruolo==='g') S.gs=v; else S.ms=v; hideBanner(); bt=setTimeout(mostraBanner, 4000); }
  else if(a==='close'){ S.open=false; hideBanner(); }
  else if(a==='dots'){ flash('Menu di Telegram'); }
  else if(a==='gs'){ S.gs=v; }
  else if(a==='ciSono'){ S.invito='si'; S.gs='home'; flash('Segnato, ti aspetta LoZio in campo.'); }
  else if(a==='nonPosso'){ S.invito='no'; S.gs='home'; flash('Va bene, sarà per la prossima.'); }
  else if(a==='piuTardi'){ S.invito='dopo'; S.gs='home'; flash('Va bene, aspetto la tua risposta.'); }
  else if(a==='nonRiesco'){ S.nonRiesco=true; flash('LoZio è stato avvisato.'); }
  else if(a==='orario'){ S.orari[v]=!S.orari[v]; }
  else if(a==='freq'){ S.due = v==='2'; }
  else if(a==='salva'){ flash('Disponibilità salvate.'); }
  else if(a==='amico'){ flash('Invito pronto da inviare.'); }
  else if(a==='liv'){ S.liv=v; }
  else if(a==='tipo'){ S.tipo=v; }
  else if(a==='apri'){ S.prop='si'; P.lun={liv:S.liv,tipo:S.tipo}; flash('Invitati 5 giocatori.'); }
  else if(a==='no'){ S.prop='no'; }
  else if(a==='avv'){ S.avv=v; }
  else if(a==='det'){ S.sel=v; S.ms='partita'; S.edit=false; S.pick=false; }
  else if(a==='ms'){ S.ms=v; S.edit=false; S.pick=false; }
  else if(a==='altri'){ S.pick=false; flash('Invitati altri 3 giocatori.'); }
  else if(a==='pick'){ S.pick=true; }
  else if(a==='inv1'){ (S.gia[S.sel]=S.gia[S.sel]||[]).push(v); S.pick=false; flash('Invitato: '+v+'.'); }
  else if(a==='mod'){ S.edit=true; }
  else if(a==='chiudiMod'){ S.edit=false; S.pick=false; }
  else if(a==='eliv'){ P[S.sel].liv=v; }
  else if(a==='etipo'){ P[S.sel].tipo=v; }
  else if(a==='salvaMod'){ S.edit=false; flash('Modifica salvata, gli invitati sono avvisati.'); }
  else if(a==='annulla'){ if(S.sel==='sab') S.sabOff=true; else if(S.sel==='mar') S.marOff=true; else S.lunOff=true; S.ms='tattiche'; flash('Partita annullata, giocatori avvisati.'); }
  render();
}
document.addEventListener('click', function(e){ var el=e.target.closest('[data-a]'); if(el) act(el.dataset.a, el.dataset.v); });
(function(){
  var q = new URLSearchParams(location.search), WA = window.Telegram && Telegram.WebApp;
  if((WA && WA.initData) || q.get('v')){
    document.body.classList.add('tgm');
    S.ruolo = q.get('v')==='m' ? 'm' : 'g';
    S.open = true;
    if(WA){ try{ WA.ready(); WA.expand(); }catch(e){} }
    bt = setTimeout(mostraBanner, 4000);
  }
})();
function fit(){ var k = Math.max(.45, Math.min(1, (window.innerHeight - 128) / 780)); document.documentElement.style.setProperty('--k', k); }
fit(); window.addEventListener('resize', fit);
render();
</script>
