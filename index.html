<style>

:root{--abs:#5A3A1F;--solo:#E8B923;--page:#E4E9E3;--bg:#F5F7F4;--card:#FFFFFF;--ink:#14201A;--ink2:#55635B;--line:#DAE1DB;--brand:#1B6B45;--onbrand:#FFFFFF;--soft:#E3EEE7;--accent:#BF2F39;--accent-soft:#FBE8E9;--lvb:#1F7044;--lvbbg:#DDEFE4;--lvm:#855A05;--lvmbg:#FAEFD3;--lva:#A22530;--lvabg:#FBE3E5;--court:#1F4E79;--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}

:root[data-theme="dark"]{--abs:#A47448;--solo:#F0C84A;--page:#0B100D;--bg:#111915;--card:#18231D;--ink:#EAF0EB;--ink2:#9BA9A0;--line:#2B382F;--brand:#52B382;--onbrand:#0B120E;--soft:#1E3027;--accent:#F0717A;--accent-soft:#3A1E21;--lvb:#6CCB93;--lvbbg:#1D3527;--lvm:#E5B64F;--lvmbg:#3A2E10;--lva:#F28A92;--lvabg:#3C1F23;--court:#2C6AA3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.45 var(--body);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.col{max-width:420px;margin:0 auto}

.bar .lbl{width:100%;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.stat.dk{background:#0E1A14;color:#fff}
.push{position:absolute;top:42px;left:10px;right:10px;z-index:15;width:calc(100% - 20px);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:14px;line-height:1.35}
.home{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.55;z-index:5;pointer-events:none}

h2{font:700 24px/1.1 var(--disp);letter-spacing:.02em;margin:0}

p{margin:0}
.mut{color:var(--ink2)}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:var(--onbrand);font-weight:600;font-size:16px;padding:10px 16px}

.sp{justify-content:space-between}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cc{min-height:54px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;line-height:1.05;min-width:0}

.grid4 .sl{min-height:40px;font-size:16px}
.foot{position:sticky;bottom:-22px;margin:auto -16px -22px;padding:10px 16px 22px;background:var(--bg);border-top:1px solid var(--line)}

.fh{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:2px 0 8px}
.err{color:var(--accent);font-size:14px;font-weight:500}
.nav{flex:none;padding-bottom:12px;display:grid;background:var(--card);border-top:1px solid var(--line)}
.nav.n3{grid-template-columns:repeat(3,1fr)}.nav.n2{grid-template-columns:repeat(2,1fr)}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--ink2);min-height:56px}
.nav{gap:6px;padding:8px 10px 12px}
.nav button{border-radius:12px;font-size:13px}
.nav button.on{background:var(--brand);color:var(--onbrand);font-weight:700}

.bdg{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px}
.vals div{background:var(--bg);border-radius:10px;padding:7px 8px}
.vals small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.vals b{font:700 22px/1.1 var(--disp);letter-spacing:.02em}
.srow{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left;min-height:54px}
.srow .t{font:700 20px/1 var(--disp);letter-spacing:.03em;min-width:50px}
.srow .m{flex:1;min-width:0}
.srow.abs{background:transparent;border-style:dashed;color:var(--ink2)}
.srow.bk{border-color:var(--brand)}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--onbrand);border-bottom-right-radius:4px}
.bub.co{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.shw{position:absolute;inset:10px;z-index:20;display:flex;align-items:flex-end;border-radius:36px;overflow:hidden}
.bd{position:absolute;inset:0;background:rgba(10,16,12,.5)}
.sheet{position:relative;width:100%;margin-top:auto;padding-bottom:30px;max-width:none;margin:0;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.tw{position:absolute;left:10px;right:10px;bottom:90px;z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;max-width:420px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.intro{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;background:#0E1A14;color:#fff}
.poster{position:relative;width:100%;height:520px;flex:none;background:var(--court);display:grid;place-items:center;overflow:hidden}
.poster svg.court{position:absolute;inset:0;width:100%;height:100%}
.poster .tt{position:relative;text-align:center}
.poster .tt b{display:block;font:700 70px/.95 var(--disp);letter-spacing:.06em}
.play{width:68px;height:68px;border-radius:50%;border:0;background:#fff;color:#0E1A14;display:grid;place-items:center;margin:18px auto 0}
.prog{height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin:16px 16px 0}
.prog i{display:block;height:100%;width:0;background:#fff}
.prog.go i{animation:pg 50s linear forwards}
@keyframes pg{to{width:100%}}
@media (prefers-reduced-motion:reduce){.prog.go i{animation-duration:50s}}
.stp{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.stp button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font:700 20px/1 var(--body)}
.stp b{text-align:center;font:700 22px/1 var(--disp)}
</style>

const DR=[
['b1','base','Dritto & Rovescio Base','Controllo impatto e ritmo','1–3','Palla piatta','2–4','Medio-corta','3,4 sec','Lento','Metà campo (4-5 m dalla macchina)'],

['a1','adv','Palleggio Alta Intensità','Memoria muscolare & cardio','7–10','Spin carico','8–10','Fondo spinto','1,8 sec','Massima frequenza','Fondo campo (7 m dalla macchina)'],
['a2','adv','Volée & Blocco Reattivo','Tempo di reazione minimo','6–8','Tiro rapido','5–6','Potenza sostenuta','1,8 sec','Massima frequenza','Sotto rete (2,5-3 m)'],

EX.forEach(e=>{const par=DR.find(d=>d.id===e[1]);DR.push(Object.assign({},par,{id:e[0],name:e[2],focus:e[3],colpo:par.name}));});
{const std=DR.filter(d=>!d.colpo),out=[];std.forEach(s=>{out.push(s);DR.filter(d=>d.colpo===s.name).forEach(v=>out.push(v));});DR.length=0;out.forEach(x=>DR.push(x));}
const drill=id=>DR.find(d=>d.id===id);

const WARM={name:'Riscaldamento · dritto e rovescio',focus:'Per abituare vista e braccio',mins:2,spin:'1–3',spinD:'Palla piatta',dist:'2–4',distD:'Medio-corta',freq:'3,4 sec',freqD:'Lento',pos:'Metà campo (4-5 m dalla macchina)'};

/* ---------- area giocatore: scheda ---------- */
function valsHtml(b){const d=t=>t?'<span class="mut" style="display:block;font-size:12px;line-height:1.2;margin-top:2px">'+t+'</span>':'';return '<div class="vals"><div><small>Spin</small><b>'+b.spin+'</b>'+d(b.spinD)+'</div><div><small>Distanza</small><b>'+b.dist+'</b>'+d(b.distD)+'</div><div><small>Frequenza</small><b>'+b.freq+'</b>'+d(b.freqD)+'</div></div><p class="sm"><span class="mut">Posizione:</span> '+b.pos+'</p>';}
const MARG=5,WORK=20-2-MARG;
const split18=n=>Array.from({length:n},(_,i)=>Math.floor(WORK/n)+(i<WORK%n?1:0));
const margHtml='<div class="blk" style="border-style:dashed"><div class="row sp"><b style="font-weight:600">Margine</b><span class="pill none">'+MARG+' min</span></div><p class="sm mut">Per arrivare, sistemarti e le pause tra un blocco e l\u2019altro.</p></div>';
const sameSet=(a,b)=>a.spin===b.spin&&a.dist===b.dist&&a.freq===b.freq&&a.pos===b.pos;
function schedaCard(s){
 const tot=s.blocks.reduce((a,b)=>a+b.mins,0)+MARG,co=s.by==='coach';
 let h='<div class="row sp wrap"><h2>La tua scheda</h2>'+lvPill(s.level)+'</div><p class="mut sm">'+(co?'Preparata dal tuo coach':'Creata da te')+' \u00b7 '+s.date+' \u00b7 '+tot+' minuti</p>';
 if(co)h+='<div class="card" style="background:var(--soft);border-color:var(--brand)"><p class="sm"><b style="font-weight:600">Alla macchina ci pensa il coach.</b> Tu pensa solo a giocare: ecco cosa farai.</p></div>';
 h+=s.blocks.map((b,i)=>'<div class="blk"><div class="row sp"><b style="font-weight:600">'+(i+1)+'. '+esc(b.name)+'</b><span class="pill none">'+b.mins+' min</span></div><p class="sm mut">'+esc(b.focus)+(b.colpo?' \u00b7 '+esc(b.colpo):'')+'</p>'+(co?'':(i>0&&sameSet(b,s.blocks[i-1])?'<p class="sm" style="margin-top:8px"><span class="pill coach">Stesso settaggio di prima</span> Non cambiare nulla sulla macchina.</p>':valsHtml(b)))+'</div>').join('');
 h+=margHtml;
 if(co)h+='<details class="card"><summary class="sm" style="cursor:pointer;min-height:32px">Valori della macchina</summary><p class="sm mut" style="margin:6px 0 10px">Ti servono solo se ti alleni da solo con questa scheda.</p>'+s.blocks.map(b=>'<p class="sm" style="margin-top:8px"><b style="font-weight:600">'+esc(b.name)+'</b></p>'+valsHtml(b)).join('')+'</details>';
 else h+='<div class="card"><p class="fh">Suggerimenti</p><p class="sm"><b style="font-weight:600">Riscaldamento.</b> I primi 2 minuti tieni la frequenza a 3,4 sec per abituare vista e braccio.</p><p class="sm" style="margin-top:6px"><b style="font-weight:600">Cambio angolazione.</b> La macchina spara in una sola direzione: per variare l\u2019angolo sposta i piedi di 1 metro.</p><p class="sm" style="margin-top:6px"><b style="font-weight:600">Ciclo continuo.</b> Indirizza la palla verso la rete di raccolta: bastano 3\u20134 palline.</p></div>';
 return h;
}
function pScheda(){
 const me=S.me;
 if(S.sView==='create')return pCreate();
 let h='';
 if(!me.schede.length){
  h+='<h2>La tua scheda</h2><div class="card"><p>Non hai ancora una scheda di allenamento. Costruiscila da solo scegliendo gli allenamenti del tuo livello, oppure chiedila al coach.</p></div><button class="btn" data-act="mkcreate">Creane una da solo</button><button class="btn sec" data-act="gocoach">Prenota una sessione con il coach</button>';
 }else{
  const s=me.schede[Math.min(S.sIdx,me.schede.length-1)];
  h+=schedaCard(s)+'<button class="btn" data-act="sheet" data-a="guida">Come regolare la macchina</button><button class="btn sec" data-act="mkcreate">Creane una nuova da solo</button>';
  if(me.schede.length>1){h+='<p class="fh">Schede precedenti</p>'+me.schede.map((x,i)=>i===S.sIdx?'':'<button class="srow" data-act="sidx" data-a="'+i+'"><span class="m"><b style="font-weight:600">'+(x.by==='coach'?'Dal coach':'Creata da te')+' · '+x.date+'</b></span>'+lvPill(x.level)+'</button>').join('');}
 }
 return h+(me.schede.length?'':'<button class="lnk" data-act="sheet" data-a="guida">Come regolare la macchina</button>');
}
const totBar=sum=>{const ok=sum===WORK,c=ok?'var(--brand)':'var(--accent)',pc=Math.min(100,Math.round(sum/WORK*100));return '<div class="totbar" style="position:sticky;top:-16px;z-index:6;margin:-16px -16px 0;padding:10px 16px;background:var(--card);border-bottom:3px solid '+c+'"><div style="display:flex;justify-content:space-between;align-items:center"><span>Minuti scelti</span><b style="font-weight:700;font-size:20px;color:'+c+'">'+sum+' min</b></div><div style="height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:'+pc+'%;background:'+c+'"></i></div><div class="sm mut" style="margin-top:4px">'+(ok?'Perfetto: con riscaldamento e margine fa 20':(sum>WORK?'Sei oltre di '+(sum-WORK)+' min: togline qualcuno':'Ne mancano '+(WORK-sum)+' (poi 2 di riscaldamento e '+MARG+' di margine = 20)'))+'</div></div>';};
const addMins=C=>{const rem=WORK-C.mins.reduce((x,y)=>x+y,0);return rem>=3?3:(rem>0?rem:1);};
const lvPick=(C,sc,act)=>{const o=l=>'<span class="dot"></span><span><b>'+LV[l].name+'</b><span class="sm mut">'+LV[l].desc+'</span></span>';
 if(C.level&&!C.lvOpen)return '<div class="card row sp" style="gap:12px;align-items:center"><div><p class="fh" style="margin:0 0 2px">Livello scelto</p><b style="font:700 22px var(--disp);letter-spacing:.03em;text-transform:uppercase;color:var(--brand)">'+LV[C.level].name+'</b><span class="sm mut" style="display:block">'+LV[C.level].desc+'</span></div><button class="btn sec sm2" style="min-height:40px;width:auto;padding:0 14px" data-act="lvopen" data-a="'+sc+'">Cambia</button></div>';
 return '<div><p class="fh">Livello</p><div style="display:flex;flex-direction:column;gap:8px">'+['base','mid','adv'].map(l=>'<button class="opt'+(C.level===l?' on':'')+'" data-act="'+act+'" data-a="'+l+'">'+o(l)+'</button>').join('')+'</div></div>';};
const drPick=(C,act)=>'<div><p class="fh">Scegli gli allenamenti (fino a 6 blocchi) · '+C.sel.length+' scelti</p><div style="display:flex;flex-direction:column;gap:8px">'+drillsOf(C.level).map(d=>'<button class="opt'+(C.sel.indexOf(d.id)>=0?' on':'')+'" data-act="'+act+'" data-a="'+d.id+'"><span class="dot"></span><span><b>'+esc(d.name)+'</b><span class="sm mut">'+esc(d.focus)+(d.colpo?' · '+esc(d.colpo):'')+'</span></span></button>').join('')+'</div></div>';
const minsList=(C,act)=>C.sel.length?'<div><p class="fh">Minuti per blocco</p>'+C.sel.map((id,i)=>'<div class="blk"><b style="font-weight:600">'+(i+1)+'. '+esc(drill(id).name)+'</b><div class="stp" style="margin-top:8px"><button data-act="'+act+'" data-a="'+i+'" data-b="-1" aria-label="Meno un minuto">−</button><b>'+C.mins[i]+' min</b><button data-act="'+act+'" data-a="'+i+'" data-b="1" aria-label="Più un minuto">+</button></div></div>').join('')+'</div>':'';
function pCreate(){
 const C=S.create;let h=totBar(C.mins.reduce((x,y)=>x+y,0))+'<h2>Crea la tua scheda</h2>'+lvPick(C,'create','clevel');
 if(C.level){h+=drPick(C,'cdr')+minsList(C,'cmin')+'<p class="sm mut">La macchina tira ogni blocco con un solo settaggio: la palla arriva sempre uguale e sei tu a muoverti, a destra, a sinistra, avanti o indietro.</p><p class="sm mut">La scheda parte con 2 minuti di riscaldamento, poi hai '+WORK+' minuti da distribuire come vuoi tra i blocchi. Gli ultimi '+MARG+' minuti sono un margine per arrivare, sistemarti e fare pause: 20 minuti in tutto.</p>';}

/* ---------- area coach ---------- */
const legendHtml=()=>{const sw=(c,t)=>'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:'+c+';display:inline-block"></i>'+t+'</span>';return '<div class="sm row wrap" style="gap:6px 14px">'+sw('var(--brand)','Con coach')+sw('var(--solo)','Da solo')+sw('var(--accent)','Da risolvere')+'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:var(--abs);display:inline-block"></i>Non ci sei</span></div>';};
function coachWeek(){
 const hrs=new Set();DAYS.forEach(k=>fasce(k).forEach(f=>f.slots.forEach(t=>hrs.add(Math.floor(mm(t)/60)))));
 const H=[...hrs].sort((a,b)=>a-b);
 let h='<div style="display:grid;grid-template-columns:34px repeat(7,1fr);gap:3px;align-items:center"><span></span>'+DAYS.map(k=>{const p=shortDay(k).split(' ');return '<button class="day" style="width:auto;padding:4px 0" data-act="wday" data-a="'+k+'" data-b="-1"><span style="font-size:11px">'+p[0]+'</span><b style="font-size:17px">'+p[1]+'</b></button>';}).join('');
 H.forEach(hr=>{h+='<span class="sm mut" style="font:600 13px var(--disp)">'+String(hr).padStart(2,'0')+':00</span>';
  DAYS.forEach(k=>{const sl=[];fasce(k).forEach(f=>f.slots.forEach(t=>{if(Math.floor(mm(t)/60)===hr)sl.push(t);}));
   if(!sl.length){h+='<span style="height:26px;border-radius:7px;background:var(--line);opacity:.35"></span>';return;}
   const fi=fasce(k).findIndex(f=>f.slots.indexOf(sl[0])>=0);
   const seg=t=>{const q=bookingAt(k,t);const bg=q?(q.away?'var(--accent)':q.who==='coach'?'var(--brand)':'var(--solo)'):isAbs(k,t)?'var(--abs)':'transparent';return '<span style="flex:1;background:'+bg+'"></span>';};
   h+='<button class="cc" style="min-height:26px;padding:0;overflow:hidden;flex-direction:row;align-items:stretch;gap:1px;background:var(--card)" data-act="wday" data-a="'+k+'" data-b="'+fi+'" aria-label="'+shortDay(k)+' ore '+hr+'">'+sl.map(seg).join('')+'</button>';});});
 const sw=(c,t)=>'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:'+c+';display:inline-block"></i>'+t+'</span>';
 h+='</div><div class="sm row wrap" style="gap:6px 14px">'+sw('var(--brand)','Con coach')+sw('var(--solo)','Da solo')+sw('var(--accent)','Da risolvere')+'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:var(--abs);display:inline-block"></i>Non ci sei</span></div><p class="mut" style="font-size:12px">Ogni casella \u00e8 un\u2019ora, divisa nei suoi slot da 20 minuti: una sola sessione per slot. Tocca una casella per aprire il giorno.</p>';
 return h;
}
function coachSlots(){

 let h='<div class="row sp"><button class="tb" data-act="cnav" data-a="-1" aria-label="Giorno prima">\u2190</button><h2 style="text-align:center;font-size:20px;white-space:nowrap">'+longDay(d)+'</h2><button class="tb" data-act="cnav" data-a="1" aria-label="Giorno dopo">\u2192</button></div>';

  h+='</div>';}
  h+='</div>';});
 return h;
}

 else if(x.t==='privacy'){c='<h2>Informativa sulla privacy</h2><p class="sm mut">Padel Village ASD · Il Muro, Area Allenamento. Aggiornata il 3 novembre 2026.</p><p class="sm"><b>In breve:</b> usiamo il tuo nome, il tuo contatto Telegram e le tue prenotazioni solo per gestire le sessioni al Muro e scriverti. Non li vendiamo e non li usiamo per pubblicità.</p><h3 style="margin:16px 0 4px;font-size:15px">Chi è il titolare dei dati</h3><p class="sm">Padel Village ASD, Via Foresto Est 1/D, 31025 Santa Lucia di Piave (TV). Legale rappresentante: Maurizio Aprea.</p><p class="sm">Per qualsiasi richiesta scrivi a <a href="mailto:padelvillage.club@gmail.com" style="color:var(--ink)">padelvillage.club@gmail.com</a>, oppure al coach dalla chat dell’app o dal bot su Telegram.</p><h3 style="margin:16px 0 4px;font-size:15px">Quali dati raccogliamo</h3><p class="sm"><ul class="sm" style="margin:0 0 8px;padding-left:18px"><li><b>Contatto:</b> nome e cognome, identificativo e nome utente Telegram, come risultano dal tuo profilo.</li><li><b>Prenotazioni:</b> giorno e ora, da solo o con il coach, tipo di sessione, disdette, cosa vuoi allenare.</li><li><b>Allenamento:</b> livello assegnato dal coach, schede create per te o da te.</li><li><b>Messaggi:</b> quelli che scrivi al coach e le sue risposte.</li><li><b>Promemoria:</b> registriamo quali ti abbiamo già inviato, per non mandarli due volte.</li></ul></p><p class="sm">Non chiediamo dati sensibili e non raccogliamo pagamenti: la sessione si paga al circolo. Gli altri giocatori vedono solo che uno slot è occupato, non chi lo ha prenotato. Il tuo livello lo vede solo il coach.</p><h3 style="margin:16px 0 4px;font-size:15px">Perché li usiamo</h3><p class="sm"><ul class="sm" style="margin:0 0 8px;padding-left:18px"><li>Gestire le prenotazioni, evitare doppioni e avvisarti se il coach non è disponibile.</li><li>Mandarti i promemoria.</li><li>Preparare le schede di allenamento.</li><li>Rispondere ai tuoi messaggi.</li></ul></p><p class="sm">Base giuridica: la tua partecipazione alle attività del circolo, che richiede questi dati (art. 6, par. 1, lett. b del GDPR).</p><h3 style="margin:16px 0 4px;font-size:15px">Con chi li condividiamo</h3><p class="sm">Fornitori dei servizi tecnici: Telegram (messaggi e apertura della mini app, con la propria informativa), Supabase (database e funzioni dell’app) e GitHub (pubblica la pagina dell’app, senza i tuoi dati di prenotazione). Non comunichiamo i tuoi dati ad altri per scopi commerciali.</p><h3 style="margin:16px 0 4px;font-size:15px">Per quanto tempo li conserviamo</h3><p class="sm">Finché usi Il Muro. Se smetti, li conserviamo per il tempo strettamente necessario a gestire eventuali richieste e comunque non oltre 24 mesi dall’ultima sessione, poi li cancelliamo. Puoi chiedere la cancellazione anche prima, in qualsiasi momento.</p><h3 style="margin:16px 0 4px;font-size:15px">I tuoi diritti</h3><p class="sm">Puoi chiederci di vedere i tuoi dati, correggerli, cancellarli, limitarne l’uso o riceverli in un formato leggibile, e puoi opporti al trattamento. Scrivi a <a href="mailto:padelvillage.club@gmail.com" style="color:var(--ink)">padelvillage.club@gmail.com</a> o al coach. Se pensi che i tuoi dati non siano trattati correttamente puoi rivolgerti al Garante per la protezione dei dati personali (garanteprivacy.it).</p>'+close;}

 return '<div class="shw"><div class="bd" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">'+c+'</div></div>';

  if(maxRun(times)>2)return say('Al massimo 2 slot di fila. Scegli uno slot staccato.');

  if(tot!==20){S.err='Riscaldamento, blocchi e margine devono fare 20 minuti in totale (ora '+tot+').';render();return;}
  const sc={id:'s'+Date.now(),by:'coach',level:C.level,date:'3 novembre',blocks:[WARM].concat(C.sel.map((id,i)=>blockOf(id,C.mins[i])))};
  if(C.player===S.me.name){const rq=S.requests.find(r=>r.id===C.reqId),nb=mineB()[0],sess=(rq&&rq.sess)||(nb?longDay(nb.date).toLowerCase()+', '+tt(mm(nb.slots[0])):'');S.pnotif={id:sc.id,sess:sess};S.me.schede.unshift(sc);S.me.chat.push({from:'co',text:C.msg||'Ecco la tua scheda. Buon allenamento!',card:sc.id});}
  S.requests=S.requests.filter(r=>r.id!==C.reqId);S.comp=null;S.err='';say('Scheda inviata. Notifica Telegram a '+C.player);top0();},
 setlv(a,b){S.sheet=null;const t=S.levelTests.find(q=>q.id===a);if(t.player===S.me.name)S.me.level=b;S.levelTests=S.levelTests.filter(q=>q.id!==a);say(t.player+' ora è '+LV[b].name+'.');}
};
function pruneSel(){const D=S.draft;if(D.who==='coach')D.sel=D.sel.filter(k=>{const p=k.split('|');return !isAbs(p[0],p[1]);});}
function keepMsg(){const e=document.getElementById('cmsg');if(e&&S.comp)S.comp.msg=e.value;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.a,t.dataset.b);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg==='csel'){keepMsg();S.comp.sel[+t.dataset.a]=t.value;render();}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form==='cchat'){e.preventDefault();const v=document.getElementById('cchat-in').value.trim();if(!v||!S.thread)return;
 if(typeof LIVE!=='undefined'&&LIVE){api('rispondi',{giocatore:S.thread.id,testo:v}).then(r=>{if(r.errore)return say(ERRMSG.x);return loadThread(S.thread.id).then(()=>reload(true));}).then(()=>{const i=document.getElementById('cchat-in');if(i)i.focus();}).catch(FAIL);return;}
 S.thread.msgs.push({from:'co',text:v});S.threads[S.thread.id]=S.thread.msgs.slice();const it=S.inbox.find(q=>q.id===S.thread.id);if(it){it.last=v;it.pending=false;}render();const i=document.getElementById('cchat-in');if(i)i.focus();return;}
if(f.dataset&&f.dataset.form==='chat'){e.preventDefault();const v=document.getElementById('chat-in').value.trim();if(!v)return;
 if(LIVE){api('scrivi',{testo:v}).then(()=>reload(true)).then(()=>{const i=document.getElementById('chat-in');if(i)i.focus();}).catch(FAIL);return;}
 S.me.chat.push({from:'me',text:v});S.feed.unshift({id:'f'+Date.now(),text:S.me.name+' ti scrive: '+v});render();const i=document.getElementById('chat-in');if(i)i.focus();}});
document.addEventListener('ended',e=>{if(e.target.id==='vid'&&S&&S.intro)ACT.skip();},true);

/* ---------- modalità reale: dentro Telegram, collegata al database ---------- */
const API='https://bckgdriuuueadplwcaog.supabase.co/functions/v1/muro-api';
const ERRMSG={occupato:'Questo slot è appena stato prenotato da un altro giocatore.',coach_assente:'Con il coach non è disponibile in questo orario. Da solo sì.',max_due_di_fila:'Al massimo 2 slot di fila.',slot_passato:'Questo slot è già passato.',giorno_non_valido:'Questo giorno non è prenotabile.',x:'Non è stato possibile completare l’operazione. Riprova.'};
async function api(az,extra){
 const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({azione:az,initData:INIT},extra||{}))});
 let j={};try{j=await r.json();}catch(e){}
 if(r.status===401)throw new Error('auth');
 if(!r.ok&&!j.errore)throw new Error('rete');
 return j;}
async function loadThread(id){const r=await api('chat_giocatore',{giocatore:id});const x=S.inbox.find(q=>q.id===id);S.thread={id:id,name:(x&&x.name)||r.name||'Giocatore',msgs:r.msgs||[]};render();}
function FAIL(e){say(e&&e.message==='auth'?'Apri Il Muro da Telegram per continuare.':'Non riesco a collegarmi. Riprova tra poco.');}
let lastJson='';
function applyState(r){
 DAYS.length=0;r.giorni.forEach(x=>DAYS.push(x));
 S.today=r.oggi;S.nowMin=r.adesso;
 S.me=Object.assign({},r.me,{schede:r.me.schede.map(s=>Object.assign({},s,{blocks:[WARM].concat((s.blocks||[]).filter(b=>drill(b.id)).map(b=>blockOf(b.id,b.mins)))}))});
 S.bookings=r.bookings;S.absent=r.absent;S.requests=r.requests;S.levelTests=r.levelTests;S.inbox=r.inbox||[];
 S.role=r.ruolo==='c'?'coach':'player';
 if(DAYS.indexOf(S.draft.day)<0)S.draft.day=DAYS[0];
 if(DAYS.indexOf(S.cday)<0)S.cday=DAYS[0];}
async function reload(force){
 const r=await api('stato');const js=JSON.stringify(r);
 if(!force&&js===lastJson)return false;
 lastJson=js;applyState(r);if(S.thread&&S.area==='coach'){try{const t=await api('chat_giocatore',{giocatore:S.thread.id});S.thread.msgs=t.msgs||[];}catch(e){}}render();return true;}
function applyStart(){
 const s=Q.get('s');
 if(s==='giorno'&&S.role==='coach'){const d=Q.get('d'),t=Q.get('t');S.intro=false;S.area='coach';S.ctab='slot';S.cview='day';S.cday=d;S.cfi=Math.max(0,fasce(d).findIndex(f=>f.slots.indexOf(t)>=0));S.hl={date:d,slot:t};}
 else if(s==='msg'&&S.role==='coach'){S.intro=false;S.area='coach';S.ctab='msg';const g=Q.get('g');if(g)loadThread(g).catch(()=>{});}
 else if(s==='scheda'){S.intro=false;S.tab='scheda';S.sView='main';S.sIdx=Math.max(0,S.me.schede.findIndex(x=>x.id===Q.get('i')));}
 else if(s==='chat'){S.intro=false;S.tab='coach';}
 else if(s==='prenota'){S.intro=false;S.tab='prenota';S.pv='book';S.draft.sel=[];}}
const msgBox=t=>'<div style="padding:32px 24px;text-align:center"><p style="font:700 28px/1.1 var(--disp);letter-spacing:.04em">IL MURO</p><p style="margin-top:12px">'+t+'</p></div>';
async function boot(){
 const root=document.getElementById('root');
 try{WA.ready();WA.expand();}catch(e){}
 try{WA.disableVerticalSwipes();}catch(e){}
 document.body.classList.add('live');
 root.innerHTML=msgBox('Caricamento…');
 S=seed('player');S.sc='live';
 let seen='';try{seen=localStorage.getItem('muro_intro')||'';}catch(e){}
 S.intro=!seen;S.cview='day';
 try{await reload(true);}catch(e){root.innerHTML=msgBox(e&&e.message==='auth'?'Apri Il Muro da Telegram per continuare.':'Non riesco a collegarmi. <button class="btn sec" style="margin-top:16px" onclick="location.reload()">Riprova</button>');return;}
 S.area=S.role==='coach'?'coach':'player';
 applyStart();render();
 setInterval(()=>{if(document.hidden||S.comp)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;reload().catch(()=>{});},45000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.comp)reload().catch(()=>{});});
 // con la chat aperta i messaggi nuovi arrivano in pochi secondi; quello che stai scrivendo non si perde
 let chatBusy=false;
 setInterval(async()=>{
  const coach=S.role==='coach';
  const inChat=coach?(S.area==='coach'&&S.ctab==='msg'&&S.thread):(S.area!=='coach'&&S.tab==='coach');
  if(document.hidden||!inChat||S.comp||chatBusy)return;
  const id=coach?'cchat-in':'chat-in';const i=document.getElementById(id);
  const v=i?i.value:'',foc=!!i&&document.activeElement===i,ss=i?i.selectionStart:0;
  chatBusy=true;
  try{if(await reload()){const j=document.getElementById(id);if(j){j.value=v;if(foc){j.focus();try{j.setSelectionRange(ss,ss);}catch(e){}}}}}catch(e){}
  chatBusy=false;},4000);}

if(LIVE){
 Object.assign(ACT,{
  async confirm(){const D=S.draft;if(!D.sel.length){S.err='Scegli almeno uno slot.';render();return;}
   const byDay={};D.sel.forEach(k=>{const p=k.split('|');(byDay[p[0]]=byDay[p[0]]||[]).push(p[1]);});
   const made=[];let first=null,erro=null;
   try{for(const d of Object.keys(byDay).sort()){const r=await api('prenota',{data:d,inizi:byDay[d],scopo:D.purpose,con_coach:D.who==='coach'});if(r.errore){erro=r.errore;break;}r.gruppi.forEach(g=>{made.push(g.id);if(!first)first={date:d,slots:g.slots};});}}catch(e){return FAIL(e);}
   const ps={purpose:D.purpose,who:D.who};
   await reload(true).catch(()=>{});
   if(erro){S.draft.sel=[];render();return say(ERRMSG[erro]||ERRMSG.x);}
   S.draft={purpose:'allenamento',who:'solo',day:DAYS[0],fi:0,sel:[]};S.pv='home';S.hist=[];
   say('Prenotato. Si paga al circolo e '+remind(first)+'.');top0();
   if(ps.who==='coach'&&ps.purpose!=='livello'){S.fsel=[];S.toast=null;S.sheet={t:'focus',ids:made};render();}},
  async fok(){const ids=S.sheet.ids;const lab=S.fsel.length?(S.fsel[0]==='coach'?'sceglie il coach':S.fsel.map(x=>FOC[x]).join(', ').toLowerCase()):'';
   try{for(const id of ids)await api('obiettivo',{gruppo:id,obiettivo:lab});await reload(true);}catch(e){return FAIL(e);}
   S.sheet={t:'sent',what:lab?'Hai scelto: '+lab+'.':'Il coach sceglie lui cosa farti allenare.'};render();},
  async fskip(){try{for(const id of S.sheet.ids)await api('obiettivo',{gruppo:id,obiettivo:''});await reload(true);}catch(e){return FAIL(e);}
   S.sheet={t:'sent',what:'Il coach sceglie lui cosa farti allenare.'};render();},
  async cancelok(a){try{const r=await api('annulla',{gruppo:a});S.sheet=null;await reload(true);
   say(r.errore==='troppo_tardi'?'Mancano meno di 2 ore: da qui non puoi più disdire. Scrivi al coach.':r.errore?ERRMSG.x:'Sessione disdetta. Lo slot è di nuovo libero.');}catch(e){FAIL(e);}},
  async csave(){const C=S.create;if(C.sel.length<1){S.err='Scegli almeno un allenamento.';render();return;}
   const tm=C.mins.reduce((x,y)=>x+y,0);if(tm!==WORK){S.err='Riscaldamento, blocchi e margine devono fare 20 minuti in totale (ora '+(2+MARG+tm)+').';render();return;}
   try{const r=await api('crea_scheda',{livello:C.level,blocchi:C.sel.map((id,i)=>({id:id,mins:C.mins[i]}))});if(r.errore){S.err=ERRMSG.x;render();return;}
    await reload(true);}catch(e){return FAIL(e);}
   S.sView='main';S.sIdx=0;S.hist=[];say('Scheda creata. La trovi qui quando arrivi alla macchina.');top0();},
  async askscheda(){if(S.requests.some(r=>r.player===S.me.name))return say('Hai già chiesto una scheda: il coach la sta preparando.');
   try{const r=await api('chiedi_scheda');await reload(true);say(r.errore==='gia_chiesta'?'Hai già chiesto una scheda: il coach la sta preparando.':'Richiesta inviata al coach.');}catch(e){FAIL(e);}},
  async cslot(a){const d=S.cday,b=bookingAt(d,a);
   if(b){S.sheet={t:'slot',d:d,a:a};render();return;}
   const on=!isAbs(d,a);
   try{await api('assenza',{data:d,inizio:a,on:on});await reload(true);say(on?'Assente alle '+a+'. Da solo si può ancora prenotare.':'Di nuovo libero: '+a);}catch(e){FAIL(e);}},
  async abssolo(a,b){try{await api('assenza',{data:a,inizio:b,on:true});S.sheet=null;await reload(true);say('Assente alle '+b+'. La sessione da solo resta valida.');}catch(e){FAIL(e);}},
  async absok(a,b){const bk=bookingAt(a,b);try{await api('assenza_avvisa',{data:a,inizio:b});S.sheet=null;await reload(true);say('Avviso inviato a '+(bk?bk.player:'')+' su Telegram.');}catch(e){FAIL(e);}},
  async fas(a){const f=fasce(S.cday)[+a],all=f.slots.every(t=>isAbs(S.cday,t));
   try{const r=await api('assenza_fascia',{data:S.cday,fascia:+a,on:!all});S.sheet=null;await reload(true);say(all?'Assenza tolta.':'Fascia segnata assente.'+(r.avvisati?' Avvisati '+r.avvisati+' giocatori.':''));}catch(e){FAIL(e);}},
  async mopen(a){try{await loadThread(a);top0();}catch(e){FAIL(e);}},
  async csend(){keepMsg();const C=S.comp,tot=2+MARG+C.mins.reduce((x,y)=>x+y,0);
   if(tot!==20){S.err='Riscaldamento, blocchi e margine devono fare 20 minuti in totale (ora '+tot+').';render();return;}
   try{const r=await api('prepara',{richiesta:C.reqId,livello:C.level,blocchi:C.sel.map((id,i)=>({id:id,mins:C.mins[i]})),messaggio:C.msg});
    if(r.errore){S.err=ERRMSG.x;render();return;}
    S.comp=null;S.err='';await reload(true);say('Scheda inviata. Notifica Telegram a '+C.player);top0();}catch(e){FAIL(e);}},
  async setlv(a,b){const t=S.levelTests.find(q=>q.id===a);try{await api('livello',{gruppo:a,livello:b});S.sheet=null;await reload(true);say((t?t.player:'Il giocatore')+' ora è '+LV[b].name+'.');}catch(e){FAIL(e);}}
 });
 boot();
}else if(Q.get('demo')){S=seed('new');render();}
else{document.getElementById('root').innerHTML='<div style="padding:40px 24px;text-align:center;font-family:system-ui,sans-serif"><p style="font:700 28px/1.1 system-ui;letter-spacing:.04em">IL MURO</p><p style="margin-top:12px">Apri Il Muro da Telegram per prenotare.</p></div>';}
</script>
