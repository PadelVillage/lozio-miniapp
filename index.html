/* Layout: un telefono centrato; interruttore Giocatore/Maestro in alto, schermata al centro, barra in basso. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --ink:#14201A; --muted:#55645B; --line:#E1E6DB;
  --accent:#135C36; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#14201A; --inv-fg:#FFFFFF; --inv-muted:#AEBBB3; --inv-panel:#1F3027; --inv-line:#3C5446;
  --ok-bg:#DDF3E4; --ok-fg:#135C36; --warn-bg:#FFF4E0; --warn-fg:#5A4A2A; --warn-line:#E7D5B0;
  --sez-c:#1F7A4D; --sez-b:#F2B84B; --sez-b-fg:#2B1D00; --soft:#E9EDE4; --danger:#8E1B1B; --danger-line:#E2B8B8; --amber:#8A5A00; --track:#DDE3D7; --bar:#1F7A4D;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#18241D; --ink:#EEF3EF; --muted:#9FB0A5; --line:#263A2E;
  --accent:#6FD39A; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#223A2D; --inv-fg:#FFFFFF; --inv-muted:#B6C6BC; --inv-panel:#2B4838; --inv-line:#4A6857;
  --ok-bg:#1D3D2B; --ok-fg:#8FE3B1; --warn-bg:#3A301B; --warn-fg:#EAD9AE; --warn-line:#5A4A2A;
  --sez-c:#2E8B5C; --sez-b:#B5832A; --sez-b-fg:#FFF8E8; --soft:#1E2D24; --danger:#F0A3A3; --danger-line:#5A2E2E; --amber:#E8B85A; --track:#2A3C31; --bar:#4FBF86;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#18241D; --ink:#EEF3EF; --muted:#9FB0A5; --line:#263A2E;
  --accent:#6FD39A; --lime:#C6F135; --lime-ink:#14201A;
  --inv-bg:#223A2D; --inv-fg:#FFFFFF; --inv-muted:#B6C6BC; --inv-panel:#2B4838; --inv-line:#4A6857;
  --ok-bg:#1D3D2B; --ok-fg:#8FE3B1; --warn-bg:#3A301B; --warn-fg:#EAD9AE; --warn-line:#5A4A2A;
  --sez-c:#2E8B5C; --sez-b:#B5832A; --sez-b-fg:#FFF8E8; --soft:#1E2D24; --danger:#F0A3A3; --danger-line:#5A2E2E; --amber:#E8B85A; --track:#2A3C31; --bar:#4FBF86;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body{display:flex;flex-direction:column;align-items:center}
#tel{width:100%;max-width:360px;flex:1 1 0;min-height:0;max-height:780px;position:relative;overflow:hidden;background:var(--bg)}
#tg,#app{position:absolute;inset:0;display:flex;flex-direction:column}
#app{background:var(--bg);z-index:5;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.tghead{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-weight:700;display:flex;align-items:center;justify-content:center}
.tghead b{display:block;font-size:16px}.tghead span{font-size:13px;color:var(--muted)}
#chat{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--soft)}
.dia{align-self:center;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);border-radius:99px;padding:2px 10px;margin-bottom:6px}
.msg{max-width:88%;background:var(--surface);border-radius:14px 14px 14px 4px;padding:8px 12px 6px;font-size:15px;line-height:1.35;align-self:flex-start;margin-top:6px}
.msg small{display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:2px}
.kb{align-self:flex-start;width:88%;display:flex;flex-direction:column;gap:4px}
.kb button{border:0;border-radius:10px;height:38px;background:color-mix(in srgb,var(--ink) 55%,transparent);color:var(--bg);font-size:14px;font-weight:500}
.inbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
.menub{background:#3390EC;color:#fff;border:0;border-radius:18px;height:36px;padding:0 16px;font-weight:700;font-size:14px}
.fake{flex:1 1 0;height:36px;border-radius:18px;background:var(--bg);color:var(--muted);display:flex;align-items:center;padding:0 14px;font-size:15px}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.ahead button{border:0;background:none;font-size:15px;color:#3390EC;padding:8px;min-width:44px}
.banner{position:absolute;left:10px;right:10px;top:58px;z-index:20;background:var(--lime);color:var(--lime-ink);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:down .25s ease-out}
.banner span{flex:1 1 0;min-width:0}
.banner button{border:0;border-radius:10px;height:36px;padding:0 14px;background:#14201A;color:#FFFFFF;font-weight:700;font-size:14px}
.banner button.x{background:none;color:#14201A;padding:0 6px;font-size:20px}
@keyframes down{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.atit{text-align:center;line-height:1.15}.atit b{display:block;font-size:15px}.atit span{font-size:12px;color:var(--muted)}
.sw{width:100%;max-width:360px;display:flex;gap:6px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:var(--inv-bg)}
.sw button{flex:1 1 0;height:36px;border-radius:10px;border:0;font-size:14px;font-weight:500;background:var(--inv-panel);color:var(--inv-muted)}
.sw button.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
#sch{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.top{padding:16px 16px 4px 70px;position:relative;min-height:44px}

.top small{display:block;font-size:14px;color:var(--muted)}
h1{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.5px;text-wrap:balance}
.lab{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.card h2{margin:0;font-size:20px;font-weight:700}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--ok-bg);color:var(--ok-fg);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}

<script>
var S = {

  orari: { fm: false, fp: false, fs: true, wm: true, wp: true }, due: false,

  ninv: '', invPronto: null, sabOff: false, lunOff: false, sel: 'sab', chat: [], dirty: false, salvato: '', confAnn: false, cand: null, selId: null, eLiv: null, eTipo: null
};

var NT = { maschile: 'Maschile', femminile: 'Femminile', mista: 'Mista' };

function snap(){ return JSON.stringify([S.orari, S.due]); }
function aggiornaDirty(){ S.dirty = snap() !== S.salvato; }
function chips(list, cur, act){ return '<div class="chips">'+list.map(function(k){ return '<button class="chip'+(cur[k[0]]?' on':'')+'" data-a="'+act+'" data-v="'+k[0]+'">'+k[1]+'</button>'; }).join('')+'</div>'; }


/* ---- Collegamento ai dati veri (solo dentro Telegram) ---- */
var APP_VER = '20261102b';
// Versione nuova online? Se sì, ricarico la pagina (non mentre scrivi). Una sola volta per versione, per non ricaricare all'infinito.
function controllaVersione(){
  if(!LIVE) return;
  var a = document.activeElement;
  if((a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) || S.dirty) return;
  fetch(location.pathname + '?chk=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/APP_VER = '(\d{8}[a-z])'/);
    if(!m || m[1]===APP_VER) return;
    try{ if(sessionStorage.getItem('rl')===m[1]) return; sessionStorage.setItem('rl', m[1]); }catch(e){}
    var u = new URL(location.href); u.searchParams.set('r', m[1]); location.replace(u.toString());
  }).catch(function(){});
}
var LIVE = false, D = null, INIT = '', ERR = '', API = 'https://bckgdriuuueadplwcaog.supabase.co/functions/v1/miniapp-api';
function api(az, extra){
  return fetch(API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({azione:az, initData:INIT}, extra||{})) })
    .then(function(r){ return r.json(); }).catch(function(){ return { errore:'rete' }; });
}
var capz = function(t){ return t.charAt(0).toUpperCase()+t.slice(1); };
function fGiorno(iso){ return capz(new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',weekday:'long',day:'numeric',month:'long'}).format(new Date(iso))); }
function fOra(iso){ return new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)); }
function fFascia(p){ return fOra(p.inizio)+'–'+fOra(p.fine); }
var visti = null, START = null;
function carica(silenzioso){
  return api('me').then(function(d){
    if(d.errore){ if(!silenzioso || !D){ ERR = d.errore; } render(); return; }
    ERR = '';
    var nuovi = (d.inviti||[]).filter(function(i){ return visti && visti.indexOf(i.id) < 0; });
    visti = (d.inviti||[]).map(function(i){ return i.id; });
    var primo = !D;
    D = d; S.ruolo = d.ruolo;
    if(primo && d.ruolo==='g'){ S.orari = d.fasce; S.due = d.due; S.salvato = snap(); S.dirty = false; }
    if(S.ruolo==='g' && S.gs==='invito' && !(d.inviti||[]).some(function(i){return i.id===S.invId;})) S.gs = 'home';
    if(primo && START){
      if(d.ruolo==='m'){ if(START.p && pAp(START.p)){ S.selId=START.p; S.ms='partita'; } else if(START.s==='tattiche'){ S.ms='tattiche'; } }
      else if(START.s==='orari'){ S.gs='orari'; }
      else if(START.i && (d.inviti||[]).length){ S.invId=d.inviti[0].id; S.gs='invito'; }
      START = null;
    }
    render();
    if(nuovi.length && S.ruolo==='g') mostraBannerL(nuovi[0]);
    if(d.ruolo==='m'){
      var conf = {}; (d.aperte||[]).forEach(function(p){ conf[p.id] = p.confermati; });
      var nc = (d.nonChiuse||[]).map(function(p){return p.id;});
      if(S.prevConf){
        var cambiata = (d.aperte||[]).filter(function(p){ return S.prevConf[p.id]!==undefined && p.confermati>S.prevConf[p.id]; })[0];
        var nuovaNC = (d.nonChiuse||[]).filter(function(p){ return (S.prevNC||[]).indexOf(p.id)<0; })[0];
        if(cambiata) mostraBannerM('Nuova conferma', fGiorno(cambiata.inizio).split(' ').slice(0,2).join(' ')+': ora '+cambiata.confermati+' su '+cambiata.posti, cambiata.id);
        else if(nuovaNC) mostraBannerM('Partita non chiusa', fGiorno(nuovaNC.inizio).split(' ').slice(0,2).join(' ')+': serve una tua decisione', nuovaNC.id);
      }
      S.prevConf = conf; S.prevNC = nc;
    }
  });
}
function mostraBannerL(i){
  var b = document.getElementById('banner'); S.bnrInv = i.id;
  b.innerHTML = '<span><b>Nuovo invito</b><br>'+fGiorno(i.inizio)+', '+fOra(i.inizio)+'</span><button data-a="bnr" data-v="invito">Rispondi</button><button class="x" data-a="bx" aria-label="Chiudi avviso">×</button>';
  b.hidden = false; clearTimeout(bh); bh = setTimeout(hideBanner, 9000);
}
function gHomeL(){
  var h = '<div class="top"><h1>Le mie Partite Tattiche</h1></div><div class="pad">';
  var pr = D.prossime||[], inv = D.inviti||[];
  if(pr.length){
    h += '<div class="lab">'+(pr.length>1?'Prossime':'Prossima')+'</div>';
    pr.forEach(function(p){
      h += '<div class="card"><div class="row"><h2>'+fGiorno(p.inizio)+'</h2><span class="pill">Confermata</span></div><div>'+fFascia(p)+' · Padel Village</div>'+
        (p.compagni.length ? '<div class="dim">Con: '+p.compagni.join(', ')+'</div>' : '<div class="dim">Ti scrivo appena la Partita Tattica è completa.</div>')+
        '<button class="btn" data-a="nonRiesco" data-v="'+p.id+'" style="margin-top:6px">Non riesco più</button></div>';
    });
  }
  if(inv.length){
    h += '<div class="lab" style="margin-top:8px">Inviti</div>';
    inv.forEach(function(i){
      h += '<div class="card inv"><div style="font-size:13px;font-weight:700;color:var(--lime)">LoZio ti ha invitato</div><h2 style="font-size:20px">'+fGiorno(i.inizio)+'</h2><div class="dim">'+fFascia(i)+' · Padel Village</div><div class="row" style="margin-top:6px"><span class="dim">'+i.costo+' euro a persona</span><button class="btn lime" style="height:40px;font-size:14px;border-radius:12px" data-a="invRisp" data-v="'+i.id+'">Rispondi</button></div></div>';
    });
  }
  if(!pr.length && !inv.length){
    h += '<div class="note"><b>Per ora nessuna Partita Tattica</b><div class="dim" style="margin-top:4px">Ti scrivo io quando ce n\'è una per te. Intanto controlla le tue disponibilità.</div></div>';
  }
  return h+'</div>';
}
function gInvitoL(){
  var i = (D.inviti||[]).filter(function(x){return x.id===S.invId;})[0];
  if(!i) return gHomeL();
  var nome = String(D.nome||'').split(' ')[0];
  var gd = fGiorno(i.inizio).split(' ');
  return '<div class="full"><button class="back" data-a="gs" data-v="home">‹ Le mie Partite Tattiche</button>'+
  '<div style="padding:32px 20px 0;display:flex;flex-direction:column;gap:10px"><div style="font-size:14px;font-weight:700;color:var(--lime)">Ciao '+nome+', LoZio ha aperto una Partita Tattica</div><h1>'+gd[0]+'<br>'+gd.slice(1).join(' ')+'</h1><div style="font-size:18px;color:var(--inv-muted)">'+fFascia(i)+' · Padel Village</div></div>'+
  '<div class="panel"><div class="row"><span>Costo</span><b>'+i.costo+' euro a persona</b></div><div class="row"><span>Si gioca in</span><b>4, con LoZio</b></div></div>'+
  '<div style="flex:1 1 auto"></div><div style="padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px"><button class="big" data-a="ciSono">Ci sono</button><div style="display:flex;gap:10px"><button class="ghost" data-a="nonPosso">Non posso</button><button class="ghost" data-a="piuTardi">Più tardi</button></div><div style="text-align:center;font-size:13px;color:var(--inv-muted)">I posti sono pochi: rispondi appena puoi.</div></div></div>';
}
var MSG = { confermata:'Segnato, ti aspetta LoZio in campo.', completa_confermata:'Segnato: la partita è completa!', gia:'Eri già segnato.', completa:'Peccato, la partita è già completa.', annullata:'Questa partita è stata annullata.', rifiutata:'Va bene, sarà per la prossima.', dopo:'Va bene, aspetto la tua risposta.', non_valido:'Questo invito non è più valido.' };
function apri(url, eTelegram){
  var W = window.Telegram && Telegram.WebApp;
  try{ if(eTelegram && W && W.openTelegramLink) W.openTelegramLink(url); else if(W && W.openLink) W.openLink(url); else window.open(url,'_blank'); }
  catch(e){ window.open(url,'_blank'); }
}
function actL(a, v){
  if(a==='invRisp'){ S.invId=v; S.gs='invito'; return true; }
  if(a==='bnr' && v==='invito'){ S.invId=S.bnrInv; S.gs='invito'; hideBanner(); return true; }
  var sc = { ciSono:'s', nonPosso:'n', piuTardi:'d' }[a];
  if(sc){
    var id = S.invId; S.gs='home'; render();
    api('rispondi',{iscrizione:id, scelta:sc}).then(function(r){ flash(r.errore ? 'Non riesco a salvare, riprova.' : (MSG[r.esito]||'Fatto.')); carica(true); });
    return true;
  }

function invitaG(a, v){
  if(a==='nuovoInv'){ S.invPronto=null; S.ninv=''; render(); return; }

    var pr = S.invPronto;
    if(LIVE && pr && pr.whatsapp) apri(v==='wa' ? pr.whatsapp : pr.telegram, v==='tg');
    else flash(v==='wa' ? 'Si apre WhatsApp con il messaggio già scritto.' : 'Si apre Telegram con il messaggio già scritto.');
    return;
  }
  var inp = document.getElementById('ninv'); if(inp) S.ninv = inp.value;
  var nome = String(S.ninv||'').replace(/\s+/g,' ').trim();
  if(nome.split(' ').length < 2){ flash('Scrivi nome e cognome.'); return; }
  if(!LIVE){ S.invPronto = { nome: nome }; render(); flash('Invito pronto.'); return; }
  api('invitaGiocatore',{nome:nome}).then(function(r){
    if(r.errore==='gia_iscritto') flash(r.giocatore+' è già iscritto.');
    else if(r.errore==='cognome') flash('Scrivi nome e cognome.');
    else if(r.errore) flash('Non riesco, riprova tra poco.');
    else { S.invPronto = { nome:r.giocatore, whatsapp:r.whatsapp, telegram:r.telegram }; render(); }
  });
}

function act(a, v){
  if(a==='prepInv' || a==='invGio' || a==='nuovoInv'){ invitaG(a, v); return; }
  if(LIVE && S.ruolo==='g' && actL(a, v)){ render(); return; }
  if(LIVE && S.ruolo==='m' && actM(a, v)){ render(); return; }
  if(a==='ruolo'){ S.ruolo=v; S.open=false; hideBanner(); }
  else if(a==='bnr'){ hideBanner(); if(v==='invito'){ S.gs='invito'; } else { S.sel='sab'; S.ms='partita'; } }
  else if(a==='bx'){ hideBanner(); }
  else if(a==='open'){ S.open=true; if(S.ruolo==='g') S.gs=v; else S.ms=v; hideBanner(); bt=setTimeout(mostraBanner, 4000); }
  else if(a==='back'){
    if(S.ruolo==='g') S.gs='home';
    else if(S.edit||S.pick){ S.edit=false; S.pick=false; }
    else S.ms = S.ms==='partita' ? 'tattiche' : 'home';
  }
  else if(a==='close'){ S.open=false; hideBanner(); }
  else if(a==='dots'){ flash('Menu di Telegram'); }
  else if(a==='gs'){ S.gs=v; }
  else if(a==='ciSono'){ S.invito='si'; S.gs='home'; flash('Segnato, ti aspetta LoZio in campo.'); }
  else if(a==='nonPosso'){ S.invito='no'; S.gs='home'; flash('Va bene, sarà per la prossima.'); }
  else if(a==='piuTardi'){ S.invito='dopo'; S.gs='home'; flash('Va bene, aspetto la tua risposta.'); }
  else if(a==='susp'){ S.sosp=!S.sosp; flash(S.sosp?'Partite Tattiche sospese.':'Bentornato! Ti riattivo.'); }
  else if(a==='nonRiesco2'){ S.invito='no'; flash('LoZio è stato avvisato.'); }
  else if(a==='nonRiesco'){ S.nonRiesco=true; flash('LoZio è stato avvisato.'); }
  else if(a==='orario'){ S.orari[v]=!S.orari[v]; aggiornaDirty(); }
  else if(a==='freq'){ S.due = v==='2'; aggiornaDirty(); }
  else if(a==='salva'){ S.salvato=snap(); S.dirty=false; flash('Disponibilità salvate.'); }
  else if(a==='amico'){ flash(v==='wa' ? 'Si apre WhatsApp con il messaggio già scritto.' : 'Si apre Telegram con il messaggio già scritto.'); }
  else if(a==='liv'){ S.liv=v; }
  else if(a==='tipo'){ S.tipo=v; }
  else if(a==='apri'){ S.prop='si'; P.lun={liv:S.liv,tipo:S.tipo}; flash('Invitati 5 giocatori.'); }
  else if(a==='no'){ S.prop='no'; }
  else if(a==='avv'){ S.avv=v; S.ms='tattiche'; flash(({annullata:'Partita annullata, giocatori avvisati.',aspetta:'Aspetto ancora, ti riscrivo domani alle 9.',altri:'Invitati altri 3 giocatori.'})[v]); }
  else if(a==='det'){ S.sel=v; S.ms='partita'; S.edit=false; S.pick=false; }
  else if(a==='ms'){ S.ms=v; S.edit=false; S.pick=false; }
  else if(a==='altri'){ S.pick=false; flash('Invitati altri 3 giocatori.'); }
  else if(a==='rip'){ if(v==='prop') S.prop='aperta'; else S.avv='aperto'; }
  else if(a==='lvl'){ S.chiusi[v]=!S.chiusi[v]; }
  else if(a==='sug'){ inviaChat(DOM[v], v); }
  else if(a==='invia'){ var inp=document.getElementById('cin'); inviaChat(inp && inp.value, 'libero'); }
  else if(a==='pick'){ S.pick=true; }
  else if(a==='inv1'){ (S.gia[S.sel]=S.gia[S.sel]||[]).push(v); S.pick=false; flash('Invitato: '+v+'.'); }
  else if(a==='mod'){ S.edit=true; }
  else if(a==='chiudiMod'){ S.edit=false; S.pick=false; }
  else if(a==='eliv'){ P[S.sel].liv=v; }
  else if(a==='etipo'){ P[S.sel].tipo=v; }
  else if(a==='salvaMod'){ S.edit=false; flash('Modifica salvata, gli invitati sono avvisati.'); }
  else if(a==='annulla'){ if(S.sel==='sab') S.sabOff=true; else if(S.sel==='mar') S.marOff=true; else S.lunOff=true; S.ms='tattiche'; flash('Partita annullata, giocatori avvisati.'); }
  render();
}
document.addEventListener('input', function(e){ if(e.target.id==='ninv') S.ninv = e.target.value; });
document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='cin'){ e.preventDefault(); act('invia'); } if(e.key==='Enter' && e.target.id==='ninv'){ e.preventDefault(); act('prepInv'); } });
document.addEventListener('click', function(e){ var el=e.target.closest('[data-a]'); if(el && el.dataset.a==='privacy'){ if(LIVE){ e.preventDefault(); apri("https://padelvillage.github.io/lozio-miniapp/privacy.html", false); } return; } if(el) act(el.dataset.a, el.dataset.v); });
(function(){
  var q = new URLSearchParams(location.search), WA = window.Telegram && Telegram.WebApp;
  if((WA && WA.initData) || q.get('v')){
    document.body.classList.add('tgm');
    S.ruolo = q.get('v')==='m' ? 'm' : 'g';
    S.open = true;
    if(WA){ try{ WA.ready(); WA.expand(); WA.BackButton.onClick(function(){ act('back'); }); }catch(e){} }
    if(WA && WA.initData){
      LIVE = true; INIT = WA.initData; START = { s:q.get('s'), p:q.get('p'), i:q.get('i') };
      carica();
      setInterval(function(){ if(!document.hidden) carica(true); }, 20000);
      // Telegram tiene la mini app "chiusa ma contratta": alla riapertura ricarico i dati e controllo se c'è una versione nuova dell'app
      var risveglio = function(){ carica(true); controllaVersione(); };
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) risveglio(); });
      try{ WA.onEvent('activated', risveglio); }catch(e){}
      setTimeout(controllaVersione, 3000);
      setInterval(function(){ if(!document.hidden) controllaVersione(); }, 300000);
    } else {
      bt = setTimeout(mostraBanner, 4000);
    }
  }
})();
function fit(){ var k = Math.max(.45, Math.min(1, (window.innerHeight - 128) / 780)); document.documentElement.style.setProperty('--k', k); }
S.salvato = snap();
fit(); window.addEventListener('resize', fit);
render();
</script>
